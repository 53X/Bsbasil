<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
        if (location.pathname !== '/') document.documentElement.classList.add('skip-boot');
        if (location.pathname === '/') {
          var hero = document.createElement('link');
          hero.rel = 'preload';
          hero.as = 'image';
          hero.href = '/hero-cube/romper-520.webp';
          hero.setAttribute('imagesrcset', '/hero-cube/romper-400.webp 400w, /hero-cube/romper-440.webp 440w, /hero-cube/romper-520.webp 520w, /hero-cube/romper.webp 800w');
          hero.setAttribute('imagesizes', '(min-width: 1024px) 384px, 280px');
          hero.setAttribute('fetchpriority', 'high');
          document.head.appendChild(hero);
        }
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="EPnSQcE_GnvhBqH5IdMfdEEyJAeywleg2h69eZgeOQk">
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="preload" href="/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Brimula.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { margin: 0; background: hsl(42 38% 96%); }
      @font-face {
        font-family: "Oswald";
        src: url("/fonts/oswald-latin.woff2") format("woff2");
        font-weight: 400 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Brimula";
        src: url("/fonts/Brimula.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      body { font-family: Oswald, "Arial Narrow", sans-serif; color: #1c241e; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        pointer-events: auto;
      }
      html.skip-boot #boot { display: none !important; }
      html:not(.css-ready) #app { visibility: hidden; }
      .boot-mark {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding-inline: 1.25rem;
        max-width: 100%;
        flex-wrap: wrap;
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-mark {
          animation: boot-rise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }
      .boot-welcome {
        margin: 0;
        font-family: Brimula, Georgia, "Times New Roman", serif;
        font-size: clamp(1.35rem, 4.4vw, 2.05rem);
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1;
        color: #60a840;
        white-space: nowrap;
      }
      .boot-logo {
        width: min(62vw, 15.5rem);
        max-width: calc(100vw - 12rem);
        height: auto;
      }
      #boot.is-leave {
        pointer-events: none;
        animation: boot-lift 0.28s ease forwards;
      }
      @keyframes boot-rise {
        from { transform: translate3d(0, 0.6rem, 0); }
        to { transform: none; }
      }
      @keyframes boot-lift {
        to { opacity: 0; }
      }
      .hero-cube-scene {
        --cube: min(64vw, calc(100vw - 3.5rem), calc(100svh - 24rem), 17.5rem);
        width: var(--cube);
        height: var(--cube);
        margin-inline: auto;
        position: relative;
        flex-shrink: 0;
      }
      .hero-cube,
      .hero-cube-tilt,
      .hero-cube-rig {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .hero-cube-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 1rem;
        background: #f4f1ea;
        backface-visibility: hidden;
      }
      .hero-cube-tilt,
      .hero-cube-rig,
      .hero-cube { transform-style: preserve-3d; }
      @media (min-width: 640px) {
        .hero-cube-scene { --cube: min(40vw, calc(100svh - 20rem), 20rem); }
      }
      @media (min-width: 1024px) {
        .hero-cube-scene { --cube: min(28vw, 46svh, 24rem); }
      }
      @media (max-height: 520px) {
        .hero-cube-scene { --cube: min(30vw, 40svh, 14rem); }
      }
    </style>
    <!--app-head-->
    <script src="/airo-video-slots.js" defer></script>
    <script src="/airo-logo-orientation.js" defer></script>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <script>
      (function () {
        if (document.querySelector('link[data-async-css]')) return;
        document.documentElement.classList.add('css-ready');
      })();
    </script>
    <div id="boot" aria-hidden="true">
      <div class="boot-mark">
        <p class="boot-welcome">Welcome to</p>
        <img class="boot-logo" src="/logo-horizontal.webp" alt="" width="248" height="72" decoding="async" fetchpriority="low" />
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var started = performance.now();
        var armed = false;
        var waitingCss = false;
        function leave() {
          if (armed || !boot) return;
          if (!document.documentElement.classList.contains('css-ready')) {
            if (waitingCss) return;
            waitingCss = true;
            var waitCss = new MutationObserver(function () {
              if (!document.documentElement.classList.contains('css-ready')) return;
              waitCss.disconnect();
              leave();
            });
            waitCss.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
            return;
          }
          armed = true;
          var wait = Math.max(0, 520 - (performance.now() - started));
          setTimeout(function () {
            boot.classList.add('is-leave');
            setTimeout(function () { boot.remove(); }, 320);
          }, wait);
        }
        window.addEventListener('bs-boot-ready', leave, { once: true });
        setTimeout(leave, 3200);
        boot.addEventListener('animationend', function (event) {
          if (event.animationName === 'boot-lift') boot.remove();
        });
      })();
    </script>
    <div id="app" class="fs-unmask-airo-app-builder"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js" defer></script>
  </body>
</html>
