<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
        if (location.pathname !== '/') document.documentElement.classList.add('skip-boot');
        var logo = document.createElement('link');
        logo.rel = 'preload';
        logo.as = 'image';
        logo.href = '/logo-horizontal.webp';
        document.head.appendChild(logo);
        if (location.pathname === '/') {
          var hero = document.createElement('link');
          hero.rel = 'preload';
          hero.as = 'image';
          hero.href = '/hero-cube/romper-640.webp';
          hero.setAttribute('fetchpriority', 'high');
          document.head.appendChild(hero);
        }
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="EPnSQcE_GnvhBqH5IdMfdEEyJAeywleg2h69eZgeOQk">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body { margin: 0; background: hsl(42 38% 96%); }
      @font-face {
        font-family: "Brimula";
        src: url("/fonts/Brimula.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        pointer-events: auto;
      }
      html.skip-boot #boot { display: none !important; }
      .boot-mark {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding-inline: 1.25rem;
        max-width: 100%;
        flex-wrap: wrap;
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-mark {
          animation: boot-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
      }
      .boot-welcome {
        margin: 0;
        font-family: Brimula, Georgia, "Times New Roman", serif;
        font-size: clamp(1.35rem, 4.4vw, 2.05rem);
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1;
        color: #60a840;
        white-space: nowrap;
      }
      .boot-logo {
        width: min(62vw, 15.5rem);
        max-width: calc(100vw - 12rem);
        height: auto;
      }
      #boot.is-leave {
        pointer-events: none;
        animation: boot-lift 0.85s cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translate3d(0, 1rem, 0); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-lift {
        to { transform: translate3d(0, -110%, 0); }
      }
      .hero-cube-scene {
        --cube: min(64vw, calc(100vw - 3.5rem), calc(100svh - 24rem), 17.5rem);
        width: var(--cube);
        height: var(--cube);
        margin-inline: auto;
        position: relative;
        flex-shrink: 0;
      }
      .hero-cube,
      .hero-cube-tilt,
      .hero-cube-rig {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .hero-cube-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 1rem;
        background: #f4f1ea;
      }
      @media (min-width: 640px) {
        .hero-cube-scene { --cube: min(40vw, calc(100svh - 20rem), 20rem); }
      }
      @media (min-width: 1024px) {
        .hero-cube-scene { --cube: min(28vw, 46svh, 24rem); }
      }
      @media (max-height: 520px) {
        .hero-cube-scene { --cube: min(30vw, 40svh, 14rem); }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" />
    </noscript>
    <!--app-head-->
    <script src="/airo-video-slots.js" defer></script>
    <script src="/airo-logo-orientation.js" defer></script>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <div id="boot" aria-hidden="true">
      <div class="boot-mark">
        <p class="boot-welcome">Welcome to</p>
        <img class="boot-logo" src="/logo-horizontal.webp" alt="" width="248" height="72" decoding="async" fetchpriority="high" />
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var started = performance.now();
        var armed = false;
        function leave() {
          if (armed || !boot) return;
          armed = true;
          var wait = Math.max(0, 1400 - (performance.now() - started));
          setTimeout(function () {
            boot.classList.add('is-leave');
            setTimeout(function () { boot.remove(); }, 900);
          }, wait);
        }
        window.addEventListener('bs-boot-ready', leave, { once: true });
        setTimeout(leave, 3200);
        boot.addEventListener('animationend', function (event) {
          if (event.animationName === 'boot-lift') boot.remove();
        });
      })();
    </script>
    <div id="app" class="fs-unmask-airo-app-builder"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js" defer></script>
  </body>
</html>
