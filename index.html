<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
        if (location.pathname !== '/') document.documentElement.classList.add('skip-boot');
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="EPnSQcE_GnvhBqH5IdMfdEEyJAeywleg2h69eZgeOQk">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body { margin: 0; background: hsl(42 38% 96%); }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        pointer-events: auto;
      }
      html.skip-boot #boot { display: none !important; }
      .boot-logo {
        width: min(62vw, 15.5rem);
        height: auto;
        transform: translate3d(0, 46vh, 0);
        animation: boot-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #boot.is-leave {
        pointer-events: none;
        animation: boot-lift 0.85s cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }
      @keyframes boot-rise {
        to { transform: translate3d(0, 0, 0); }
      }
      @keyframes boot-lift {
        to { transform: translate3d(0, -110%, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { display: none !important; }
      }
      #hero-lcp {
        position: absolute;
        z-index: 2;
        left: 1rem;
        right: 1rem;
        top: 23.8rem;
        width: calc(100% - 2rem);
        height: 26rem;
        object-fit: contain;
        object-position: center;
        border-radius: 1.25rem;
        background: #f4f1ea;
      }
      @media (min-width: 1024px) {
        #hero-lcp {
          position: fixed;
          top: 4.2rem;
          right: max(1rem, calc((100vw - 76rem) / 2));
          left: auto;
          width: min(58vw, 48rem);
          height: calc(100dvh - 4.2rem);
          object-fit: cover;
          border-radius: 999px 999px 18px 18px;
        }
      }
      #hero-lcp[data-still] {
        position: absolute;
        inset: 0;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        z-index: 1;
        object-fit: cover;
        object-position: center;
        border-radius: inherit;
      }
      .hero-cube-scene {
        --cube: min(64vw, calc(100vw - 3.5rem), calc(100svh - 24rem), 17.5rem);
        width: var(--cube);
        height: var(--cube);
        margin-inline: auto;
        position: relative;
        flex-shrink: 0;
      }
      .hero-cube,
      .hero-cube-tilt,
      .hero-cube-rig {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .hero-cube-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 1rem;
        background: #f4f1ea;
      }
      @media (min-width: 640px) {
        .hero-cube-scene { --cube: min(40vw, calc(100svh - 20rem), 20rem); }
      }
      @media (min-width: 1024px) {
        .hero-cube-scene { --cube: min(28vw, 46svh, 24rem); }
      }
      @media (max-height: 520px) {
        .hero-cube-scene { --cube: min(30vw, 40svh, 14rem); }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" />
    </noscript>
    <!--app-head-->
    <script src="/airo-video-slots.js" defer></script>
    <script src="/airo-logo-orientation.js" defer></script>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <div id="boot" aria-hidden="true">
      <img class="boot-logo" src="/logo-horizontal.webp" alt="" width="248" height="72" decoding="async" />
    </div>
    <img
      id="hero-lcp"
      src="/hero-cube/romper-640.webp"
      alt="Rompers"
      width="640"
      height="800"
      fetchpriority="high"
      decoding="async"
    />
    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var started = performance.now();
        var armed = false;
        function leave() {
          if (armed || !boot) return;
          armed = true;
          var wait = Math.max(0, 820 - (performance.now() - started));
          setTimeout(function () {
            boot.classList.add('is-leave');
            setTimeout(function () { boot.remove(); }, 900);
          }, wait);
        }
        window.addEventListener('bs-boot-ready', leave, { once: true });
        setTimeout(leave, 2000);
        boot.addEventListener('animationend', function (event) {
          if (event.animationName === 'boot-lift') boot.remove();
        });
      })();
    </script>
    <div id="app" class="fs-unmask-airo-app-builder"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js" defer></script>
  </body>
</html>
