<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #FFFAF7;
    font-family: 'Nunito', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 32px;
    padding: 64px 80px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    width: 1100px; height: 550px;
    box-shadow: 0 8px 48px rgba(232,115,74,0.12);
    border: 2px solid #F5D5C5;
  }
  .eyebrow { font-size: 22px; color: #E8734A; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 16px; }
  h1 { font-size: 72px; font-weight: 900; color: #1a1a1a; line-height: 1.1; margin-bottom: 24px; }
  h1 span { color: #E8734A; }
  .sub { font-size: 28px; color: #888; font-weight: 400; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #E8734A; margin-right: 8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">✨ Bsbasil</div>
    <h1>Soft. Safe.<br><span>Adorable.</span></h1>
    <div class="sub"><span class="dot"></span>Baby &amp; Toddler Clothing · Ages 0–3</div>
  </div>
</body>
</html>
